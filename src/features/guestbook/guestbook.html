<h2 class="section-title">Guestbook</h2>
<p class="section-sub">Bhai ke liye pyaar bhara message chhod jao.</p>
<form class="f-gb__form" id="gb-form">
  <input class="f-gb__input" id="gb-name" placeholder="Naam" maxlength="30" required />
  <textarea class="f-gb__input" id="gb-msg" placeholder="Message" maxlength="200" rows="3" required></textarea>
  <button class="btn btn--primary" type="submit">Post Karein</button>
</form>
<div class="f-gb__list" id="gb-list"></div>
