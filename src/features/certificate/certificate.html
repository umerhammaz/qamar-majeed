<h2 class="section-title">Friendship Certificate</h2>
<p class="section-sub">Official proof — Qamar Majeed is Bhai of the Year.</p>
<div class="f-cert__controls">
  <input id="cert-name" class="f-cert__input" type="text" placeholder="Apna naam likho" maxlength="40" />
  <button class="btn btn--primary" id="cert-generate">Generate</button>
  <button class="btn" id="cert-print">Print</button>
</div>
<div class="f-cert__card" id="cert-card">
  <p class="f-cert__title">Certificate of Brotherhood</p>
  <p>Ye certify karta hai ke</p>
  <p class="f-cert__name" id="cert-name-out">—</p>
  <p>Qamar Majeed ka official bhai hai.</p>
  <p class="f-cert__small">Terms: lifetime pyaar, unlimited memes, aur ek chai zaroori hai.</p>
  <p class="f-cert__sign">— Bhai Council of Pakistan</p>
</div>
